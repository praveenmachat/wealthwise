<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WealthWise — Sign in</title><script src="auth.js"></script><style>body{font:16px system-ui;background:#faf9f6;color:#183828;margin:0;display:grid;min-height:100vh;place-items:center}main{background:white;padding:32px;border:1px solid #ddd;border-radius:16px;width:min(380px,85vw)}label{display:block;margin-top:16px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;font:inherit;border:1px solid #aaa;border-radius:8px}button{background:#1a472a;color:white;cursor:pointer}button.secondary{background:white;color:#1a472a}#message{line-height:1.5}small{color:#555}</style></head><body><main><h1>WealthWise</h1><p>Sign in to your private cloud portfolio.</p><small>First visit after the database replacement? Create your secure account and verify your email.</small><form id="auth-form"><label>Name<input id="name" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button id="signin" type="submit">Sign in</button><button id="signup" class="secondary" type="button">Create secure account</button></form><p id="message" role="status"></p><a href="index.html">Back to website</a></main><script>
async function submitAccount(register) {
 const form=document.getElementById('auth-form');
 if(!form.reportValidity())return;
 const message=document.getElementById('message');
 const buttons=[...form.querySelectorAll('button')];
 buttons.forEach(b=>b.disabled=true);
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 message.textContent=register?'Creating your account…':'Signing in…';
 try {
  if(register){
   const result=await WW.register(document.getElementById('name').value.trim(),email,password);
   if(!result.access_token){message.textContent='Check your email and confirm your account, then return here to sign in.';return;}
  }else await WW.login(email,password);
  window.location.href='app.html';
 }catch(error){message.textContent=error.message;}
 finally{buttons.forEach(b=>b.disabled=false);}
}
document.getElementById('auth-form').addEventListener('submit',e=>{e.preventDefault();submitAccount(false);});
document.getElementById('signup').addEventListener('click',()=>submitAccount(true));
</script></body></html>
